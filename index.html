<style>
/* Valeurs du thème BetterLap v6 */
:root {
  color-scheme: dark;
  --radius: 5px;
  --background: #000000;
  --foreground: #F5F5F6;
  --muted-foreground: #989898;
  --primary: #5239FE;
  --chart-1: #7C86FF;
  --warning: #FFB400;
  --halo: rgb(16 18 48 / 60%);
  --font-sans: "Open Sans", ui-sans-serif, system-ui, sans-serif;
  --font-heading: "Saira Condensed", "Arial Narrow", sans-serif;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background-color: var(--background);
  /* Halo de fond : démarre au bord haut et s'éteint aux bords gauche et droit */
  background-image: radial-gradient(ellipse 66.67% 360px at 50% 0, var(--halo), transparent 75%);
  background-repeat: no-repeat;
  color: var(--foreground);
  font: 400 14px/24px var(--font-sans);
  -webkit-font-smoothing: antialiased;
  display: flex;
  flex-direction: column;
}
header { padding: 32px clamp(24px, 4vw, 48px); }
.logo { width: min(200px, 50vw); height: auto; display: block; margin: 0 auto; }
main {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 32px 24px 64px; text-align: center;
}
.badge {
  display: inline-flex; align-items: center; gap: 6px; height: 20px; margin: 0; padding: 0 8px;
  border: 1px solid transparent; border-radius: 999px; background: color-mix(in oklab, var(--warning) 15%, transparent); color: var(--warning);
  font-size: 12px; line-height: 1; font-weight: 500; white-space: nowrap;
}
.logos { display: flex; align-items: center; justify-content: center; gap: clamp(24px, 8vw, 96px); margin-top: 96px; }
.logos img { display: block; width: min(136px, 36vw); height: 44px; object-fit: contain; }
.logos img.lmu { position: relative; top: 5px; }
h1 {
  margin: 40px 0 0; max-width: 960px;
  font-family: var(--font-heading); font-weight: 700;
  font-size: clamp(48px, min(8vw, 10vh), 104px); line-height: .9; text-transform: uppercase; text-wrap: balance;
}
.lead { max-width: 580px; margin: 32px 0 0; font-size: 18px; line-height: 28px; color: oklch(0.86 0 0); text-wrap: pretty; }
/* Halo qui suit la souris : cinq nappes bleues décalées, comme sur la landing page. */

<script>
(function () {
const h = document.querySelector('.bl-halo');
if (!h || !window.requestAnimationFrame) return;
let RAF = 0;
const blobs = [
{ ox: -170, oy: -40, w: 520, h: 300, k: 0.12, f: 0.00021, a: 46 },
{ ox: 150, oy: -110, w: 300, h: 400, k: 0.07, f: 0.00017, a: 60 },
{ ox: 60, oy: 140, w: 420, h: 220, k: 0.05, f: 0.00025, a: 52 },
{ ox: -60, oy: 90, w: 240, h: 260, k: 0.09, f: 0.00031, a: 38 },
{ ox: 260, oy: 60, w: 260, h: 180, k: 0.04, f: 0.00014, a: 70 }
];
const n = ['a', 'b', 'c', 'd', 'e'];
let s = null;
const still = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const loop = (t) => {
const r = h.getBoundingClientRect();
if (!s) {
const hx = r.width / 2, hy = r.height / 2;
s = { tx: hx, ty: hy, home: true, p: blobs.map(() => ({ x: hx, y: hy, sx: 0, sy: 0 })) };
}
if (s.home) { s.tx = r.width / 2; s.ty = r.height / 2; }
s.p.forEach((p, i) => {
const b = blobs[i];
const vx = (s.tx - p.x) * b.k, vy = (s.ty - p.y) * b.k;
p.x += vx; p.y += vy;
p.sx += (Math.min(180, Math.abs(vx) * 8) - p.sx) * 0.12;
p.sy += (Math.min(150, Math.abs(vy) * 8) - p.sy) * 0.12;
const ph = still ? 0 : (t || 0) * b.f;
const dx = Math.sin(ph + i * 1.7) * b.a, dy = Math.cos(ph * 1.3 + i * 2.3) * b.a * 0.7;
const breathe = still ? 1 : 1 + Math.sin(ph * 1.6 + i) * 0.12;
h.style.setProperty('--' + n[i] + 'x', (p.x + b.ox + dx).toFixed(1) + 'px');
h.style.setProperty('--' + n[i] + 'y', (p.y + b.oy + dy).toFixed(1) + 'px');
h.style.setProperty('--' + n[i] + 'w', ((b.w + p.sx - p.sy * 0.4) * breathe).toFixed(1) + 'px');
h.style.setProperty('--' + n[i] + 'h', ((b.h + p.sy - p.sx * 0.4) * (2 - breathe)).toFixed(1) + 'px');
});
RAF = requestAnimationFrame(loop);
};
RAF = requestAnimationFrame(loop);
// Le halo suit la souris et revient doucement au centre quand elle sort de la page.
const move = (e) => {
if (!s || (e.pointerType && e.pointerType !== 'mouse')) return;
const r = h.getBoundingClientRect();
s.home = false;
s.tx = e.clientX - r.left;
s.ty = e.clientY - r.top;
};
const leave = () => { if (s) s.home = true; };
document.addEventListener('pointermove', move, true);
document.documentElement.addEventListener('mouseleave', leave);
})();
</script>
