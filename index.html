<title>BetterLap, l'ingénieur de course de ton simulateur</title>
<meta name="description" content="BetterLap lit ta télémétrie à chaque tour, repère ce qui te coûte du temps et écrit le réglage qui le corrige.">

<style>
/* Valeurs du thème BetterLap v6 */
:root {
  color-scheme: dark;
  --radius: 5px;
  --background: #000000;
  --foreground: #F5F5F6;
  --muted-foreground: #989898;
  --primary: #5239FE;
  --primary-foreground: #FFFFFF;
  --input: rgb(255 255 255 / 10%);
  --halo: rgb(16 18 48 / 60%);
  --success: #97CC04;
  --font-sans: "Open Sans", ui-sans-serif, system-ui, sans-serif;
  --font-heading: "Saira", ui-sans-serif, sans-serif;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background-color: var(--background);
  /* Halo de fond : démarre au bord haut et s'éteint aux bords gauche et droit */
  background-image: radial-gradient(ellipse 66.67% 360px at 50% 0, var(--halo), transparent 75%);
  background-repeat: no-repeat;
  color: var(--foreground);
  font: 400 14px/24px var(--font-sans);
  -webkit-font-smoothing: antialiased;
  display: grid;
  grid-template-rows: 1fr auto;
}
main {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 64px 24px; text-align: center;
}
.logo { width: min(320px, 70vw); height: auto; display: block; }
.badge {
  display: inline-flex; align-items: center; gap: 6px; height: 20px; margin-top: 48px; padding: 0 8px;
  border: 1px solid var(--input); border-radius: 999px;
  font-size: 12px; line-height: 1; font-weight: 500; white-space: nowrap;
}
.badge i { width: 6px; height: 6px; border-radius: 50%; background: var(--success); }
h1 {
  margin: 24px 0 0; max-width: 960px;
  font-family: var(--font-heading); font-weight: 700; font-stretch: 87.5%; font-variation-settings: "wdth" 87.5;
  font-size: clamp(40px, 8vw, 88px); line-height: .9; text-transform: uppercase;
}
.lead { max-width: 580px; margin: 24px 0 0; font-size: 18px; line-height: 28px; color: var(--muted-foreground); text-wrap: pretty; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 40px; margin-top: 32px; padding: 0 20px; border-radius: 4px;
  background: var(--primary); color: var(--primary-foreground);
  font: 500 14px/20px var(--font-sans); text-decoration: none; white-space: nowrap;
  transition: background-color .15s;
}
.btn:hover { background: rgb(82 57 254 / 90%); }
.btn:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.btn svg { width: 16px; height: 16px; }
.games { margin: 16px 0 0; font-size: 12px; line-height: 20px; color: var(--muted-foreground); }
footer { padding: 24px; text-align: center; font-size: 12px; line-height: 20px; color: var(--muted-foreground); }
</style>
</head>
